services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: bingo
      POSTGRES_DB: bingo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bingo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo -d bingo"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://bingo:bingo@db:5432/bingo
      PORT: 3000
      MAX_ACTIVE_ROOMS: 10
      ROOM_TTL_HOURS: 48
      INACTIVE_GRACE_SECONDS: 60
    depends_on:
      db:
        condition: service_healthy
volumes:
  bingo_pg:
